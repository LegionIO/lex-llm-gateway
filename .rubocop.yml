inherit_gem:
  rubocop-legion: config/lex.yml

# RunnerReturnHash fires on helper methods that return non-Hash values (booleans, symbols, primitives)
# These are private helper methods, not public runner entry points
Legion/Extension/RunnerReturnHash:
  Enabled: false

# RunnerIncludeHelpers fires on runners using module_function (which is equivalent to extend self)
Legion/Extension/RunnerIncludeHelpers:
  Enabled: false
